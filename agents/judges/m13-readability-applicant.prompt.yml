name: M13 applicant letter readability
description: Score how readable and respectful the applicant letter is.
model: openai/gpt-4o-mini
modelParameters:
  temperature: 0.0
testData: []
messages:
  - role: system
    content: |
      You are a Vancouver municipal planning reviewer with five years of front-counter experience.
      Score the applicant-facing letter below on readability and respectful tone.
      Respond with a single JSON object: {"score": <float in [0, 1]>, "rationale": "<one sentence>"}.
      Do not return any text outside the JSON object.
      Use these anchors:
      - 1.0 = clear plain language, no jargon, the next step is named, and the tone is warm.
      - 0.5 = some jargon, the next step is identifiable but not named, and the tone is neutral.
      - 0.0 = heavy jargon, the next step is missing, or the tone is bureaucratic or cold.
  - role: user
    content: |
      Case context:
      {{case_context}}

      Applicant letter under review:
      {{artifact_under_review}}

      Reference outputs:
      {{reference_outputs}}
evaluators:
  - name: judge-output-is-valid-json
    string:
      contains: '"score"'
